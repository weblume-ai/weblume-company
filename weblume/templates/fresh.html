<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسم النشاط | جملة قصيرة عن النشاط</title>
<meta name="description" content="وصف قصير للنشاط في سطر">
<meta property="og:title" content="اسم النشاط">
<meta property="og:description" content="وصف قصير للنشاط في سطر">
<meta name="theme-color" content="#141414">
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<!--WEBLUME:MOTION_CSS-->
<style>
/* A blank, well-built starting point. The DESIGN DIRECTION in the brief decides how the sections look.
   Change colors only here, from the client's brand. */
:root{--bg:#f6f2ea;--surface:#fffdf8;--ink:#141414;--muted:#6b665e;--accent:#c8102e;--line:#e4ddd0;
  --display:"Alexandria",system-ui,sans-serif;--text:"IBM Plex Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:1.06rem/1.8 var(--text)}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0 0 .4em}
h1{font-size:clamp(2.6rem,8vw,7rem);letter-spacing:-.02em}
h2{font-size:clamp(2rem,5vw,4rem)}
section{padding:clamp(64px,10vw,140px) clamp(20px,5vw,72px);scroll-margin-top:72px}
.wrap{max-width:1240px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border:0;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* header */
.nav{position:fixed;inset-inline:0;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:14px clamp(20px,5vw,72px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.nav .brand img{height:34px;width:auto}
.nav nav{margin-inline-start:auto;display:flex;gap:22px}
.nav nav a{text-decoration:none;font-weight:500}
.menu-btn{display:none;margin-inline-start:auto;background:none;border:0;font-size:26px;min-width:44px;min-height:44px}
@media (max-width:820px){
  .menu-btn{display:block}
  .nav nav{display:none;position:fixed;inset:64px 0 auto 0;flex-direction:column;padding:24px;background:var(--bg);border-bottom:1px solid var(--line)}
  .nav nav.open{display:flex}
}
.ph{background:var(--line);border-radius:18px;aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.ph::after{content:attr(data-label)}
footer{padding:40px clamp(20px,5vw,72px);border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;display:flex;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body data-wa="">
<header class="nav">
  <a class="brand" href="#top" aria-label="اسم النشاط"><img src="logo.svg" alt="اسم النشاط" width="160" height="34"></a>
  <button class="menu-btn" data-menu-toggle aria-expanded="false" aria-label="القائمة">☰</button>
  <nav data-menu><a href="#about" data-en="About">عننا</a><a href="#work" data-en="Work">شغلنا</a><a href="#contact" data-en="Contact">تواصل</a>
    <button class="btn ghost" data-lang-toggle style="min-height:40px">EN</button></nav>
</header>
<main id="top">
  <!-- HERO: build it from the HERO blueprint in the brief. One short headline (6 words max), one line, one main button. -->
  <section class="hero"><div class="wrap">
    <h1 class="split">عنوان قصير بيقول الفكرة</h1>
    <p class="reveal">سطر واحد: مين إحنا ونقدم إيه.</p>
    <a class="btn magnetic" href="#contact" data-wa-msg="أهلاً، عايز أعرف أكتر" data-en="Talk to us">كلمنا على واتساب</a>
  </div></section>
  <!-- SECTIONS: 3 to 6, each from a SECTION blueprint in the brief, each looking different from the one before. -->
  <section id="about"><div class="wrap"><h2 class="reveal">عننا</h2><p class="reveal">…</p></div></section>
  <section id="work"><div class="wrap"><h2 class="reveal">شغلنا</h2><div class="ph reveal" data-label="صورة حقيقية من العميل"></div></div></section>
  <section id="contact"><div class="wrap"><h2 class="reveal">تواصل معانا</h2>
    <a class="btn" href="#" data-wa-msg="أهلاً، عايز أحجز / أطلب" data-en="Message us on WhatsApp">ابعتلنا على واتساب</a></div></section>
</main>
<footer><span>© <span id="y"></span> اسم النشاط</span><span>تصميم <a href="https://weblume-sa.github.io" target="_blank" rel="noopener noreferrer">Weblume</a></span></footer>
<script>document.getElementById("y").textContent = new Date().getFullYear();</script>
<!--WEBLUME:MOTION_JS-->
</body>
</html>
