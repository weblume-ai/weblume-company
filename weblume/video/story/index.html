<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>الكافيه بتاعك</title>
<style>
  /* Two faces only: Cairo (display), IBM Plex Sans Arabic (UI). */
  @font-face { font-family: Display; src: url(fonts/display.ttf) format('truetype'); font-weight: 200 1000; }
  @font-face { font-family: UI; src: url(fonts/ui-500.ttf) format('truetype'); font-weight: 400 600; }
  @font-face { font-family: UI; src: url(fonts/ui-700.ttf) format('truetype'); font-weight: 700 900; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
